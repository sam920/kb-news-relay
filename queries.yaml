# 国际新闻搜索关键词配置
# fetch_news.py 会在 GitHub Actions 上据此搜索 Google News RSS
# 修改此文件后 push 即可生效，无需修改 Python 代码
# 注意：Google News RSS 支持多语言，hl=zh-CN 可以搜中文内容

鹦鹉养殖:
  - "parrot CITES conservation"
  - "parrot breeding news"
  - "psittacine artificial insemination"
  - "parrot genetic research"
  # 中文搜索（Google News 也支持中文搜索）
  - "鹦鹉养殖 政策 市场"
  - "鹦鹉 人工繁育 标识 2026"
  - "鹦鹉 合法饲养 标识"
  - "China parrot farming policy"
  - "China parrot breeding market"

肽类产品:
  - "GLP-1 drug FDA approval"
  - "peptide therapeutic clinical trial"
  - "semaglutide tirzepatide news"
  - "GLP-1 obesity diabetes new indication"
  # 中文搜索
  - "GLP-1 多肽药物 审批"

疫苗产品:
  # 审批与管线
  - "vaccine FDA approval clinical trial"
  - "mRNA vaccine new development"
  - "VLP vaccine pipeline"
  # 佐剂
  - "vaccine adjuvant novel adjuvant system"
  - "AS01 AS03 MF59 CpG adjuvant"
  # 专利 — 独立分组
  - "mRNA vaccine patent lipid nanoparticle"
  - "vaccine adjuvant patent"
  - "vaccine patent infringement lawsuit"
  - "vaccine patent expiration"
  # 中文
  - "疫苗 审批 临床试验 2026"
  - "mRNA疫苗 重组蛋白疫苗 新型疫苗"
  - "疫苗佐剂 新型佐剂"
  - "疫苗 佐剂 专利 授权 2026"
  - "mRNA 疫苗 专利 诉讼"
